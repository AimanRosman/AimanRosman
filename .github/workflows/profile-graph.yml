name: Update contribution arcade

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/profile-graph.yml']

permissions: {}

concurrency:
  group: profile-contribution-graph
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Generate public contribution SVGs
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: AimanRosman
          games: pacman
          hide_month_labels: 'false'
      - name: Save the two generated images
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: contribution-arcade
          path: |
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Download the images from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: contribution-arcade
          path: generated
      - name: Publish only the expected SVGs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {'pacman-contribution-graph.svg', 'pacman-contribution-graph-dark.svg'}
          folder = Path('generated')
          if {item.name for item in folder.iterdir()} != expected:
              raise SystemExit('Unexpected graph artifact contents')
          for name in expected:
              path = folder / name
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 20_000_000:
                  raise SystemExit('Invalid graph artifact')
              if ET.parse(path).getroot().tag != '{http://www.w3.org/2000/svg}svg':
                  raise SystemExit('Expected an SVG document')
          PY
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth_header"
          git_api() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" "$@"; }
          if git_api ls-remote --exit-code origin refs/heads/pacman-output > /dev/null; then
            git_api fetch origin pacman-output
            git worktree add --detach graph-publication FETCH_HEAD
          else
            result=$?
            if [ "$result" -ne 2 ]; then exit "$result"; fi
            mkdir graph-publication
            git -C graph-publication init --initial-branch=pacman-output
            git -C graph-publication remote add origin "https://github.com/$GH_REPO.git"
          fi
          cp generated/pacman-contribution-graph.svg generated/pacman-contribution-graph-dark.svg graph-publication/
          cd graph-publication
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pacman-contribution-graph.svg pacman-contribution-graph-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh contribution arcade'
          git_api push origin HEAD:refs/heads/pacman-output
